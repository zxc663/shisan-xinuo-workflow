<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606A"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <rect x="8" y="8" width="1184" height="704" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>

  <text x="48" y="50" font-size="22" font-weight="bold" fill="#1F2328">让规则「在场」：触达四件套（v2.7.0）</text>

  <!-- 目标 -->
  <rect x="330" y="70" width="540" height="56" rx="10" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
  <text x="600" y="104" font-size="17" font-weight="bold" fill="#1F2328" text-anchor="middle">目标：每条规则都能被照着做，不靠领会</text>

  <line x1="600" y1="126" x2="600" y2="160" stroke="#57606A" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 四卡片：w=255，间距 24，起点 x=54 -->
  <!-- 1 注入三层 -->
  <rect x="54" y="160" width="255" height="320" rx="12" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="2"/>
  <rect x="70" y="174" width="112" height="28" rx="14" fill="#1F6FEB"/>
  <text x="126" y="192" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">注入三层</text>
  <text x="74" y="230" font-size="18" font-weight="bold" fill="#1F2328">平台注入</text>
  <text x="74" y="258" font-size="16" fill="#57606A">硬注入（三层承载）或</text>
  <text x="74" y="282" font-size="16" fill="#57606A">按需注入（应用层）</text>
  <line x1="74" y1="304" x2="290" y2="304" stroke="#D0D7DE"/>
  <text x="74" y="330" font-size="16" fill="#57606A">记忆层 + 规则层 +</text>
  <text x="74" y="354" font-size="16" fill="#57606A">配置层写入平台注入点</text>
  <text x="74" y="396" font-size="15" fill="#8C959F">验收：新会话上下文读</text>
  <text x="74" y="420" font-size="15" fill="#8C959F">到「在场提示」，zxc663</text>
  <text x="74" y="444" font-size="15" fill="#8C959F">自检彩蛋回话</text>

  <!-- 2 项目承载 -->
  <rect x="333" y="160" width="255" height="320" rx="12" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/>
  <rect x="349" y="174" width="112" height="28" rx="14" fill="#8250DF"/>
  <text x="405" y="192" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">项目承载</text>
  <text x="353" y="230" font-size="18" font-weight="bold" fill="#1F2328">文件落地（随项目携带）</text>
  <text x="353" y="258" font-size="16" fill="#57606A">memory/agent-log.md 一档制</text>
  <text x="353" y="282" font-size="16" fill="#57606A">（状态/教训/偏好/流水四区）</text>
  <line x1="353" y1="304" x2="569" y2="304" stroke="#D0D7DE"/>
  <text x="353" y="330" font-size="16" fill="#57606A">docs/project-info.md 六节</text>
  <text x="353" y="354" font-size="16" fill="#57606A">（模块真实状态表+全景文档）</text>
  <text x="353" y="378" font-size="16" fill="#57606A">项目级规则文件（回指强制）</text>
  <text x="353" y="420" font-size="15" fill="#8C959F">第二个 Agent 站在同一个</text>
  <text x="353" y="444" font-size="15" fill="#8C959F">记忆上，不重新考古</text>

  <!-- 3 委托纪律包 -->
  <rect x="612" y="160" width="255" height="320" rx="12" fill="#FFFFFF" stroke="#2DA44E" stroke-width="2"/>
  <rect x="628" y="174" width="112" height="28" rx="14" fill="#2DA44E"/>
  <text x="684" y="192" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">委托纪律包</text>
  <text x="632" y="230" font-size="18" font-weight="bold" fill="#1F2328">子代理直送</text>
  <text x="632" y="258" font-size="16" fill="#57606A">子代理不继承注入副本、不</text>
  <text x="632" y="282" font-size="16" fill="#57606A">保证触发 Skill 加载（实证）</text>
  <line x1="632" y1="304" x2="848" y2="304" stroke="#D0D7DE"/>
  <text x="632" y="330" font-size="16" fill="#57606A">委托时内联最小纪律包：判级</text>
  <text x="632" y="354" font-size="16" fill="#57606A">/ 红线 / 证据四要件 / TOP /</text>
  <text x="632" y="378" font-size="16" fill="#57606A">引用形态 / GATE / 承载</text>
  <text x="632" y="420" font-size="15" fill="#8C959F">堵住「主代理守纪律、子</text>
  <text x="632" y="444" font-size="15" fill="#8C959F">代理旁路」的洞</text>

  <!-- 4 hooks 纪律包（v2.7 新增） -->
  <rect x="891" y="160" width="255" height="320" rx="12" fill="#FFFFFF" stroke="#D1242F" stroke-width="2"/>
  <rect x="907" y="174" width="118" height="28" rx="14" fill="#D1242F"/>
  <text x="966" y="192" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">hooks 纪律包</text>
  <text x="911" y="230" font-size="18" font-weight="bold" fill="#D1242F">机制级触达（v2.7）</text>
  <text x="911" y="258" font-size="16" fill="#57606A">SessionStart 无条件常驻提醒</text>
  <text x="911" y="282" font-size="16" fill="#57606A">（状态行+TOP 一行+GATE 指针）</text>
  <line x1="911" y1="304" x2="1127" y2="304" stroke="#D0D7DE"/>
  <text x="911" y="330" font-size="16" fill="#57606A">PostToolUseFailure 错误时刻</text>
  <text x="911" y="354" font-size="16" fill="#57606A">TOP 推送（带工具名）</text>
  <text x="911" y="378" font-size="16" fill="#D1242F" font-weight="bold">平台触发器配置后=真正闭环</text>
  <text x="911" y="420" font-size="15" fill="#8C959F">路测 v5：无头面注入断裂下</text>
  <text x="911" y="444" font-size="15" fill="#8C959F">hooks 载体 12/12 被接住</text>

  <!-- 边界声明 -->
  <rect x="54" y="520" width="1092" height="150" rx="12" fill="#FFF1F0" stroke="#D1242F" stroke-width="2"/>
  <text x="74" y="556" font-size="18" font-weight="bold" fill="#D1242F">边界声明：提示词范畴 ≠ 机制保证</text>
  <text x="74" y="588" font-size="16" fill="#57606A">无论注入 / 承载 / 委托做得多重，这终究是「提示词在场」——抵不上平台级「新会话自动加载」的机制保证。</text>
  <text x="74" y="616" font-size="16" fill="#57606A">配置 hooks / SessionStart 触发器后可闭环机制级触达：注入 → 行为跟随、门控零误触发、并发不丢（机评实证，见验证与路测 ①c）。</text>
  <text x="74" y="644" font-size="15" fill="#8C959F">四件套中注入 / 承载 / 委托为提示词范畴；hooks 层为唯一机制级通道（需平台支持触发器，非所有平台可用）。</text>
</svg>